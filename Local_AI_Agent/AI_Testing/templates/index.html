<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flask Calculator</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <div class="calculator-card">
      <header class="calculator-header">
        <div class="header-left">
          <span class="status-dot"></span>
          <h1>Calculator</h1>
        </div>
        <div class="header-actions">
          <button id="toggle-sci-btn" class="icon-btn" title="Toggle Scientific Functions">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5z"></path>
              <path d="M6 6h10M6 10h10"></path>
            </svg>
            <span class="btn-text">Sci</span>
          </button>
          <button id="toggle-history-btn" class="icon-btn" title="Toggle History">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
          </button>
        </div>
      </header>

      <!-- Display Area -->
      <div class="display-container">
        <div class="expression-display" id="expression-display">&nbsp;</div>
        <div class="main-display" id="main-display">0</div>
        <div class="error-badge" id="error-badge"></div>
      </div>

      <!-- Keypad -->
      <div class="keypad-layout">
        <!-- Scientific Row (collapsible or toggled) -->
        <div class="scientific-panel" id="scientific-panel">
          <button class="btn btn-func" data-action="func" data-val="sqrt(">√</button>
          <button class="btn btn-func" data-action="op" data-val="^">xʸ</button>
          <button class="btn btn-func" data-action="func" data-val="sin(">sin</button>
          <button class="btn btn-func" data-action="func" data-val="cos(">cos</button>
          <button class="btn btn-func" data-action="func" data-val="tan(">tan</button>
          <button class="btn btn-func" data-action="func" data-val="log10(">log</button>
          <button class="btn btn-func" data-action="func" data-val="log(">ln</button>
          <button class="btn btn-func" data-action="num" data-val="pi">π</button>
          <button class="btn btn-func" data-action="num" data-val="e">e</button>
          <button class="btn btn-func" data-action="func" data-val="fact(">n!</button>
        </div>

        <!-- Main Keys -->
        <div class="keypad-grid">
          <button class="btn btn-special" data-action="clear" title="Clear (Esc)">AC</button>
          <button class="btn btn-special" data-action="backspace" title="Backspace">⌫</button>
          <button class="btn btn-special" data-action="paren" data-val="(">(</button>
          <button class="btn btn-special" data-action="paren" data-val=")">)</button>

          <button class="btn btn-num" data-action="num" data-val="7">7</button>
          <button class="btn btn-num" data-action="num" data-val="8">8</button>
          <button class="btn btn-num" data-action="num" data-val="9">9</button>
          <button class="btn btn-op" data-action="op" data-val="÷">÷</button>

          <button class="btn btn-num" data-action="num" data-val="4">4</button>
          <button class="btn btn-num" data-action="num" data-val="5">5</button>
          <button class="btn btn-num" data-action="num" data-val="6">6</button>
          <button class="btn btn-op" data-action="op" data-val="×">×</button>

          <button class="btn btn-num" data-action="num" data-val="1">1</button>
          <button class="btn btn-num" data-action="num" data-val="2">2</button>
          <button class="btn btn-num" data-action="num" data-val="3">3</button>
          <button class="btn btn-op" data-action="op" data-val="−">−</button>

          <button class="btn btn-num" data-action="num" data-val="0">0</button>
          <button class="btn btn-num" data-action="num" data-val=".">.</button>
          <button class="btn btn-op" data-action="op" data-val="%">%</button>
          <button class="btn btn-op" data-action="op" data-val="+">+</button>

          <button class="btn btn-equals" data-action="calculate" title="Calculate (Enter)">=</button>
        </div>
      </div>
    </div>

    <!-- History Drawer / Panel -->
    <aside class="history-panel" id="history-panel">
      <div class="history-header">
        <h3>History</h3>
        <div class="history-actions">
          <button id="clear-history-btn" class="text-btn" title="Clear History">Clear</button>
          <button id="close-history-btn" class="icon-btn" title="Close">✕</button>
        </div>
      </div>
      <div class="history-list" id="history-list">
        <p class="empty-state">No calculations yet</p>
      </div>
    </aside>
  </div>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
